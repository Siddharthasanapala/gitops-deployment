# Throwaway proof-of-concept for the portfolio-apps ApplicationSet — this
# folder existing is the only thing that should be needed for a new
# Application to appear on its own. Safe to delete once proven; deleting it
# (and pushing) should make ArgoCD prune the Application away too.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-demo
  template:
    metadata:
      labels:
        app: hello-demo
    spec:
      containers:
        - name: hello-demo
          image: nginx:alpine
          ports:
            - containerPort: 80
