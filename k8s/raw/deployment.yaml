apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: portfolio-raw
  labels:
    app: portfolio
spec:
  replicas: 1
  # lib/rateLimit.ts's in-memory limiter is single-instance-only (see
  # DEPLOYMENT.md §7.8) — do not raise replicas without also moving that to a
  # shared store.
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      containers:
        - name: portfolio
          image: ghcr.io/siddharthasanapala/siddhartha-portfolio:a899847
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: portfolio-secrets
            - configMapRef:
                name: portfolio-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
