{{/*
Off by default (values.yaml: secret.create: false). The chart only
*references* an externally-created Secret (see values.yaml's comment) —
this template exists so someone could opt into Helm-managed secrets via
--set/-f at install time, but the default path never lets a real credential
enter values.yaml or this repo's git history.
*/}}
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.secret.data | nindent 2 }}
{{- end }}
