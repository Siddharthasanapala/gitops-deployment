# SHAPE REFERENCE ONLY — do not `kubectl apply` this file as-is, and never fill
# in real values here or commit real values anywhere in this repo.
#
# The real Secret is created imperatively, directly against the cluster, per
# DEPLOYMENT.md §8:
#
#   kubectl create secret generic portfolio-secrets -n portfolio-raw \
#     --from-env-file=.env
#
# (.env lives in the app repo, is already gitignored there, and is never
# copied into this GitOps repo.)
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-secrets
  namespace: portfolio-raw
type: Opaque
stringData:
  GEMINI_API_KEY: "REPLACE_ME"
  RESEND_API_KEY: "REPLACE_ME"
  CONTACT_EMAIL: "REPLACE_ME"
  SITE_URL: "REPLACE_ME"
  SMTP_HOST: "REPLACE_ME"
  SMTP_PORT: "REPLACE_ME"
  SMTP_USER: "REPLACE_ME"
  SMTP_PASS: "REPLACE_ME"
